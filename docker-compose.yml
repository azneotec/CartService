# MongoDB for running CartService on its own (see Makefile: `make infra-up`).
# Host port defaults to 27018 so it can run beside the root stack's MongoDB (27017); override with
# MONGO_PORT, and keep MONGODB_URI in .env pointing at the same port.
name: cart-service

services:
  mongodb:
    image: mongo:7.0
    container_name: cart-service-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  mongo-data:
