spring.application.name=cart-service

# 8003 for a single instance; start a second instance with SERVER_PORT=9003 so both register with Eureka
# under the same name (cart-service) on different ports.
server.port=${SERVER_PORT:8003}

# MongoDB comes from the environment; the default is the root compose MongoDB (root/password, auth db admin).
# Real values must only ever be supplied via MONGODB_URI.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://root:password@localhost:27017/cart_service?authSource=admin}

eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Redis caches each user's cart (cache-aside; MongoDB stays the source of truth). The defaults are the root
# compose Redis; the Redis calls are short-timeout so a Redis outage degrades to MongoDB reads instead of hanging.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s
cart.cache.ttl=30m

# Downstream calls go through Eureka (user-auth-service validates tokens, product-catalog-service prices products).
cart.clients.connect-timeout=2s
cart.clients.read-timeout=5s
